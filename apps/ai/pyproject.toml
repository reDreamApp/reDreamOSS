[project]
name = "redream-ai"
version = "0.1.0"
description = "reDreamAI: stateless IRT chatbot + crisis classifier + Voxtral audio."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "mistralai>=1.2,<2",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "supabase>=2.10",
    # Ported IRT chatbot core (redream_ai/core, redream_ai/clinical_safety):
    # OpenAI-compatible SDK drives Scaleway (primary) + direct Mistral (fallback);
    # groq SDK is referenced by the registry but unused at runtime; networkx builds
    # the clinical knowledge graph.
    "openai>=1.40",
    "groq>=0.11",
    "networkx>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redream_ai"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Vendored: the ported IRT core + safety engine are copied verbatim from the SU
# Streamlit repo (see chatbot integration brief — "do not reflow or clean up").
# Excluded from our lint/type rules; only the redream_ai-authored glue is strict.
extend-exclude = [
    "src/redream_ai/core",
    "src/redream_ai/clinical_safety",
    "chatbot_port",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are the idiomatic way to set route defaults;
# they are not the mutable-default-arg footgun B008 targets.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Form",
    "fastapi.Header", "fastapi.Path", "fastapi.Cookie", "fastapi.Body",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

# Third-party SDKs used only by the vendored core that ship no type stubs.
[[tool.mypy.overrides]]
module = ["groq.*", "networkx.*", "dotenv.*"]
ignore_missing_imports = true

# Vendored: ported IRT core + safety engine (copied verbatim; not type-clean by
# design). Imports still resolve; their internal type errors are not reported.
# implicit_reexport: the glue code accesses names the vendored modules re-import
# (e.g. irt_app.routing_agent, process_chat_message) without an explicit __all__.
[[tool.mypy.overrides]]
module = ["redream_ai.core.*", "redream_ai.clinical_safety.*"]
ignore_errors = true
implicit_reexport = true
