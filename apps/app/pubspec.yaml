name: redream_app
description: "reDreamOSS — record, rewrite and rehearse difficult dreams"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.4.2
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  flutter_timezone: ^5.0.1
  http: ^1.4.0
  intl: any
  just_audio: ^0.9.46
  package_info_plus: ^9.0.0
  path_provider: ^2.1.6
  provider: ^6.1.5
  record: ^6.2.1
  shared_preferences: ^2.5.3
  timezone: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

# Onboarding pictures: SVG sources in assets/source/onboarding/ (not bundled);
# export each at 960x600 with a transparent background to
# assets/images/onboarding_<name>.png.

# App icon: replace assets/icon/app_icon.png (1024x1024, transparent), then
#   fvm dart run flutter_launcher_icons
#   git checkout ios/Runner.xcodeproj/project.pbxproj
# The checkout undoes a generator bug (0.14.4): it overwrites the unrelated
# Xcode setting ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon.png
