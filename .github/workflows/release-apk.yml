# Builds the web app for a version tag, and the signed Android APK once the
# signing key is set up, and attaches them to a GitHub Release (`make start`
# downloads the web app for its tag). Push a tag like v1.2.0 on a commit of
# main; see RELEASING.md for the optional signing key (four repository secrets).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: web app (+ signed APK) → GitHub Release
    # make start downloads from this repository; the tag push of a fork does nothing.
    if: github.repository == 'reDreamApp/reDreamOSS'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    defaults:
      run:
        working-directory: apps/app
    # Actions pinned to commits: this job holds the signing key.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # to check the tag is on main
          persist-credentials: false # gh uses GH_TOKEN; Gradle never sees a token
      - name: Check the tag is a version on main
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          printf '%s' "${GITHUB_REF_NAME#v}" | grep -Eq '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$' \
            || { echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH (each 0-999)"; exit 1; }
          # Only reviewed code gets the project's signature.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      # Reads the FVM pin, like the CI app job.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: apps/app/.fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # No secrets: the release carries the web app only. Some of them: a mistake, stop.
      - name: Write the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          present=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "value=\${$name}"
            [ -z "$value" ] || present=$((present + 1))
          done
          if [ "$present" -eq 0 ]; then
            echo "::notice::no signing key (RELEASING.md): this release carries the web app only"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$present" -eq 4 ] || { echo "::error::only $present of the four ANDROID_* signing secrets are set (RELEASING.md)"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # One APK for every server: it asks for the address on first start.
      # The version code comes from the tag (1.2.3 -> 1002003), so it always
      # grows, whatever happens to this workflow's run counter.
      - name: Build the APK
        if: steps.key.outputs.signed == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"; rest="${version#*.}"
          minor="${rest%%.*}"; patch="${rest#*.}"
          code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          flutter build apk --release --build-name "$version" --build-number "$code"
      - name: Remove the signing key
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks
      # The same flags as scripts/start.py's local build: nothing from a CDN.
      - name: Build the web app
        run: flutter build web --release --no-web-resources-cdn
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          web="reDreamOSS-web-$GITHUB_REF_NAME.zip"
          (cd build/web && zip -qrX "../../$web" .)
          sha256sum "$web" > "$web.sha256"
          set -- "$web" "$web.sha256"
          notes="The web app (reDreamOSS-web-*.zip) is what make start serves on your own computer; it is fetched automatically."
          if [ "$SIGNED" = true ]; then
            apk="reDreamOSS-$GITHUB_REF_NAME.apk"
            cp build/app/outputs/flutter-apk/app-release.apk "$apk"
            sha256sum "$apk" > "$apk.sha256"
            set -- "$apk" "$apk.sha256" "$@"
            notes="Android app for any reDreamOSS server: install it, then enter your server's address (it must be https). $notes"
          else
            notes="$notes No Android app in this release; servers can hand out their own build (docs/SELF_HOSTING.md)."
          fi
          gh release create "$GITHUB_REF_NAME" "$@" \
            --verify-tag \
            --title "reDreamOSS $GITHUB_REF_NAME" \
            --notes "$notes Check downloads against their .sha256 files. Server changes in this version are in the commit history; update servers before handing out a new app (RELEASING.md)."
