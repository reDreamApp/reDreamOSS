name: CI

# Gates (docs/ROADMAP.md item 1): tests for the server and the app, lint for
# redream_ai and the Flutter analyzer (both fully green). redream_api lint
# (ruff / mypy) is RED AT BASELINE — it runs as an informational step
# (continue-on-error) until the dedicated cleanup pass, so CI is meaningful
# instead of permanently red.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: apps/server — pytest + ruff + mypy (redream_api lint informational)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      # setup-uv stopped publishing floating major tags in v8 — pin exactly.
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check src/redream_ai tests/ai evals
      - run: uv run mypy src/redream_ai
      - name: ruff redream_api (informational — red baseline, see docs/ROADMAP.md)
        run: uv run ruff check src/redream_api tests/api
        continue-on-error: true
      - name: mypy redream_api (informational — red baseline, see docs/ROADMAP.md)
        run: uv run mypy src/redream_api
        continue-on-error: true

  migrations:
    name: supabase migrations apply from zero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      # `db start` boots the Supabase Postgres image (auth/storage schemas
      # included — plain postgres would reject the auth.users FKs), then
      # `migration up --local` applies supabase/migrations/ from zero.
      # This replaces the Supabase-dashboard GitHub integration as the
      # migration gate (the free-tier cloud project auto-pauses; see
      # RELEASING.md).
      - run: supabase db start
      - run: supabase migration up --local

  app:
    name: apps/app — flutter analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      # Reads the FVM pin so CI can never drift from local (`apps/app/.fvmrc`).
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: apps/app/.fvmrc
          cache: true
      # pubspec bundles .env as an asset and .env is gitignored.
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
