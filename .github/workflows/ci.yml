name: CI

# Gates (docs/ROADMAP.md item 1): tests for the server and the app, lint for
# redream_ai and the Flutter analyzer (both fully green). redream_api lint
# (ruff / mypy) is RED AT BASELINE — it runs as an informational step
# (continue-on-error) until the dedicated cleanup pass, so CI is meaningful
# instead of permanently red.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: apps/server — pytest + ruff + mypy (redream_api lint informational)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      # setup-uv stopped publishing floating major tags in v8 — pin exactly.
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check src/redream_ai tests/ai evals
      - run: uv run mypy src/redream_ai
      - name: ruff redream_api (informational — red baseline, see docs/ROADMAP.md)
        run: uv run ruff check src/redream_api tests/api
        continue-on-error: true
      - name: mypy redream_api (informational — red baseline, see docs/ROADMAP.md)
        run: uv run mypy src/redream_api
        continue-on-error: true

  postgres-schema:
    name: postgres schema — migrations from zero, drift + smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      # setup-uv stopped publishing floating major tags in v8 — pin exactly.
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      # The runner as the container runs it, twice: the second run must find
      # migrations/ fully applied and change nothing.
      - name: migrate from zero, then again
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
        run: |
          uv run python -m redream_api.db.migrate
          uv run python -m redream_api.db.migrate
      # tests/pg migrates (and wipes) a database of its own: an empty one.
      - name: create the empty test database
        run: |
          uv run python -c "
          import asyncio, asyncpg
          async def main():
              conn = await asyncpg.connect('postgresql://postgres:postgres@localhost:5432/postgres')
              await conn.execute('CREATE DATABASE redream_test')
              await conn.close()
          asyncio.run(main())"
      # REQUIRE_PG: a missing TEST_DATABASE_URL fails instead of skipping all.
      - name: pytest tests/pg (runner, schema drift vs the ORM, smoke)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/redream_test
          REQUIRE_PG: "1"
        run: uv run pytest -q tests/pg
      - run: uv run ruff check tests/pg

  app:
    name: apps/app — flutter analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      # Reads the FVM pin so CI can never drift from local (`apps/app/.fvmrc`).
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: apps/app/.fvmrc
          cache: true
      # pubspec bundles .env as an asset and .env is gitignored.
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
